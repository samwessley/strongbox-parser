name: Build Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl python-dateutil pyinstaller
    
    - name: Build Windows executable
      run: |
        pyinstaller strongbox_parser.spec
    
    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: strongbox-parser-windows
        path: dist/StrongboxParser.exe
        
    - name: Create release asset (on release)
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: dist/StrongboxParser.exe
        asset_name: StrongboxParser-Windows.exe
        asset_content_type: application/octet-stream

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl python-dateutil pyinstaller
    
    - name: Build Mac executable
      run: |
        pyinstaller strongbox_parser.spec
    
    - name: Upload Mac executable
      uses: actions/upload-artifact@v4
      with:
        name: strongbox-parser-macos
        path: dist/StrongboxParser
        
    - name: Create release asset (on release)
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: dist/StrongboxParser
        asset_name: StrongboxParser-macOS
        asset_content_type: application/octet-stream 